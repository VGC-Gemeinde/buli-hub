# CI on every push/PR; CD to Cloud Run on main after CI passes.
# Repository configuration this expects (docs/deployment.md §GitHub):
#   Variables: GCP_PROJECT_ID, GCP_REGION, GCP_ARTIFACT_REPO, GCP_SERVICE,
#              GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA,
#              NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   Secrets:   PROD_DATABASE_URL
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # supabase/config.toml substitutes these via env(); dummies suffice for
      # the CI stack (nobody signs in with Discord here).
      SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID: ci-dummy
      SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc --noEmit
      # The integration tests need the real local stack: they write to the
      # Supabase-managed auth schema, which plain Postgres does not have.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: npm test -- --run
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy
          SUPABASE_SECRET_KEY: ci-dummy

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    # Serialize deploys; a superseded run is cancelled before it ships.
    concurrency:
      group: deploy
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_SERVICE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL='${{ vars.NEXT_PUBLIC_SUPABASE_URL }}' \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY='${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}' \
            -t "$IMAGE" .
          docker push "$IMAGE"
      # Migrations ship in the same commit as the code using them (CLAUDE.md);
      # apply them right before the new revision goes live.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations to production
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy '${{ vars.GCP_SERVICE }}' \
            --image "$IMAGE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --quiet

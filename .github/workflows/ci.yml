# CI on every push/PR; CD to Cloud Run on main (production) and dev (staging)
# after CI passes. Deploy configuration lives in the repo's PROD and STAGING
# environments (docs/deployment.md §3):
#   Variables: GCP_PROJECT_ID, GCP_REGION, GCP_ARTIFACT_REPO, GCP_SERVICE,
#              GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA,
#              CLOUD_SQL_INSTANCE
#   Secrets:   PROD_DATABASE_URL (STAGING: STAGING_DATABASE_URL), both through
#              the Cloud SQL Auth Proxy on 127.0.0.1:5432
name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    # The same Postgres as compose.yaml, on the port the test guard accepts
    # (src/test/local-database.ts). Nothing in the suite talks to storage, so
    # no emulator.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - run: npx drizzle-kit migrate
      - run: npm test -- --run
      - run: npm run build

  # One job, two targets. `main` deploys to PROD, `dev` to STAGING; every
  # vars.*/secrets.* below then resolves from whichever environment is
  # selected, so the two deployments cannot drift apart in their steps.
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: checks
    runs-on: ubuntu-latest
    # All deploy variables/secrets live in this environment (single source
    # of truth) — without declaring it, none of them resolve.
    environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'STAGING' }}
    # Serialize deploys per target; a superseded run is cancelled before it
    # ships. Staging and production never queue behind each other.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_SERVICE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      # Migrations ship in the same commit as the code using them (CLAUDE.md);
      # apply them right before the new revision goes live.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The instance takes no connection from outside except through the Auth
      # Proxy (research.md R3). STAGING defines STAGING_DATABASE_URL; PROD does
      # not, so the fallback picks PROD_DATABASE_URL there. Both point at the
      # proxy on 127.0.0.1:5432, each with its own database user.
      - uses: ./.github/actions/cloud-sql-proxy
        with:
          instance: ${{ vars.CLOUD_SQL_INSTANCE }}
      - name: Apply migrations
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL || secrets.PROD_DATABASE_URL }}
      # --update-env-vars, not --set-env-vars: the service's other environment
      # variables are configured on Cloud Run itself and must survive a deploy.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy '${{ vars.GCP_SERVICE }}' \
            --image "$IMAGE" \
            --region '${{ vars.GCP_REGION }}' \
            --project '${{ vars.GCP_PROJECT_ID }}' \
            --update-env-vars "APP_BUILD_SHA=${{ github.sha }}" \
            --quiet

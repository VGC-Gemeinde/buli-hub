schema_version: "1.0"

extension:
  id: buli
  name: "Buli Hub workflow"
  version: "1.0.0"
  description: "Project steps for Buli Hub: mockups before planning (Gate 1) and the Definition of Done check before commit (Gate 3)"
  author: buli-hub
  repository: https://github.com/VGC-Gemeinde/buli-hub
  license: MIT

requires:
  speckit_version: ">=1.1.0"

provides:
  commands:
    - name: speckit.buli.mockups
      file: commands/speckit.buli.mockups.md
      description: "Design and iterate the feature's mockups, export them into the spec, and get the maintainer's approval of spec and mockups"
    - name: speckit.buli.ship
      file: commands/speckit.buli.ship.md
      description: "Check the Definition of Done, freeze spec and plan to what was built, and hand the work to the maintainer for approval"

hooks:
  before_plan:
    command: speckit.buli.mockups
    optional: false
    description: "Mockups and Gate 1 before implementation planning"
  after_converge:
    command: speckit.buli.ship
    optional: false
    description: "Definition of Done and Gate 3 once converge finds no gaps"

tags:
  - "workflow"
  - "ux"

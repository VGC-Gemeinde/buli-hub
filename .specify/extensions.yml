installed:
- gemeinde
settings:
  auto_execute_hooks: true
hooks:
  before_plan:
  - extension: gemeinde
    command: speckit.gemeinde.mockups
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.gemeinde.mockups?
    description: Mockups and Gate 1 before implementation planning
    condition: null
  after_converge:
  - extension: gemeinde
    command: speckit.gemeinde.ship
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.gemeinde.ship?
    description: Definition of Done and Gate 3 once converge finds no gaps
    condition: null

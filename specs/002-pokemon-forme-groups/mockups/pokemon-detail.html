<!doctype html>
<!-- Mockup for specs/002-pokemon-forme-groups. Approved 2026-10-17 (Panel "Formen", full names). Built on the approved 001 mockup (specs/001-pokemon-usage-stats/mockups); only the Pokémon detail changes. Example data only. Sprites from the justhit-sprites bucket (Sinistcha-Masterpiece from the Showdown CDN fallback); type icons from partywhale/pokemon-type-icons (MIT). -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Buli Formen Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a mockup toolbar over two live frames (desktop 1120px, phone 390px)
   that render the same view; the hub's own tokens live on .hub, the shell's
   on :root. Responsive rules inside the frames are container queries, so both
   widths show at once. */
:root {
  --shell-bg: oklch(0.975 0.006 262);
  --shell-fg: oklch(0.28 0.06 264);
  --shell-muted: oklch(0.52 0.035 263);
  --shell-border: oklch(0.9 0.012 262);
  --shell-card: #ffffff;
  --shell-accent: #ff7b00;
  --font: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shell-bg: oklch(0.13 0.035 265); --shell-fg: oklch(0.96 0.005 260);
    --shell-muted: oklch(0.72 0.025 262); --shell-border: oklch(1 0 0 / 12%);
    --shell-card: oklch(0.17 0.045 265); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --shell-bg: oklch(0.13 0.035 265); --shell-fg: oklch(0.96 0.005 260);
  --shell-muted: oklch(0.72 0.025 262); --shell-border: oklch(1 0 0 / 12%);
  --shell-card: oklch(0.17 0.045 265); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--shell-bg); color: var(--shell-fg); font-family: var(--font); margin: 0; }
.shell { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-start; margin-bottom: 22px; }
.toolbar h1 { font-size: 15px; margin: 0; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.toolbar .sub { font-size: 12.5px; color: var(--shell-muted); margin-top: 4px; max-width: 46ch; line-height: 1.45; }
.tgroup { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tgroup > span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--shell-muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12.5px/1 var(--font); padding: 7px 11px; border-radius: 999px; border: 1px solid var(--shell-border); background: var(--shell-card); color: var(--shell-fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--shell-accent); border-color: var(--shell-accent); color: #fff; font-weight: 600; }
.chip:focus-visible, .hub :focus-visible { outline: 2px solid var(--shell-accent); outline-offset: 2px; }
.frames { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.fwrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; max-width: 100%; }
.fwrap > span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--shell-muted); }
.fscroll { overflow-x: auto; max-width: 100%; border-radius: 14px; border: 1px solid var(--shell-border); box-shadow: 0 10px 30px oklch(0.2 0.06 264 / 0.10); }
.fwrap.desk { flex: 1 1 760px; }
.fwrap.desk .hub { width: 1120px; }
.fwrap.phone { flex: 0 0 auto; }
.fwrap.phone .hub { width: 390px; }
@media (max-width: 440px) { .fwrap.phone .hub { width: calc(100vw - 34px); } }

/* ---------- Hub tokens (copied from src/app/globals.css) ---------- */
.hub {
  --brand-blue: #021f66; --brand-orange: #ff7b00;
  --background: #ffffff; --foreground: oklch(0.28 0.06 264);
  --card: #ffffff; --muted: oklch(0.965 0.008 262); --muted-foreground: oklch(0.52 0.035 263);
  --border: oklch(0.91 0.012 262); --input: oklch(0.91 0.012 262);
  --chart-1: #021f66; --chart-2: #ff7b00; --tick-neutral: oklch(0.91 0.012 262);
  --heading: #021f66;
  --thead: oklch(0.975 0.006 262); --row-hover: oklch(0.965 0.008 262);
  --type-normal: #828282; --type-fire: #e4613e; --type-water: #3a9de2; --type-grass: #439837; --type-electric: #dfbc28; --type-ice: #47c8c8; --type-fighting: #e49021; --type-poison: #9354cb; --type-ground: #a4733c; --type-flying: #74aad0; --type-psychic: #e96c8c; --type-bug: #9f9f28; --type-rock: #a9a481; --type-ghost: #6f4570; --type-dragon: #576fbc; --type-dark: #4f4747; --type-steel: #77b2cb; --type-fairy: #e18ce1;
  container-type: inline-size; container-name: hub;
  background: var(--background); color: var(--foreground);
  font-family: var(--font); font-size: 14px; line-height: 1.5;
  min-height: 640px; display: flex; flex-direction: column;
}
.hub.dark {
  --background: oklch(0.17 0.045 265); --foreground: oklch(0.96 0.005 260);
  --card: oklch(0.21 0.05 265); --muted: oklch(1 0 0 / 8%); --muted-foreground: oklch(0.72 0.025 262);
  --border: oklch(1 0 0 / 12%); --input: oklch(1 0 0 / 15%);
  --chart-1: oklch(0.75 0.17 55); --chart-2: oklch(0.65 0.14 264); --tick-neutral: oklch(1 0 0 / 30%);
  --heading: #ffffff; --thead: oklch(0.2 0.045 265); --row-hover: oklch(0.235 0.045 265); color-scheme: dark;
}
.hub button, .hub select { font-family: var(--font); color: inherit; }
.hub a { color: inherit; text-decoration: none; }
.tick { display: inline-block; flex-shrink: 0; transform: skewX(-18deg); background: var(--brand-orange); }
.tick.s { width: 14px; height: 7px; } .tick.m { width: 18px; height: 9px; } .tick.l { width: 22px; height: 11px; }
.tick.neutral { background: var(--tick-neutral); }
.num { font-variant-numeric: tabular-nums; }
.mf { color: var(--muted-foreground); }

/* site header */
.accent { height: 3px; background: var(--brand-orange); }
.hdr { display: grid; grid-template-columns: auto minmax(0,1fr) auto; column-gap: 14px; padding: 8px 16px 0; }
.logo { display: flex; align-items: center; gap: 12px; height: 48px; }
.logo img { width: 41px; height: 28px; border-radius: 6px; }
.logo span { display: none; font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
.hnav { display: flex; align-items: stretch; height: 48px; }
.hnav a { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 11px; font-size: 14px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; }
.hnav a.on { font-weight: 600; color: var(--heading); background: var(--muted); border-radius: 6px 6px 0 0; }
.hnav .long { display: none; }
.hright { display: flex; align-items: center; height: 48px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, oklch(0.6 0.12 264), oklch(0.45 0.12 280)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.srow { display: flex; height: 44px; background: var(--muted); padding: 0 4px; box-shadow: inset 0 -1px 0 var(--border); overflow-x: auto; scrollbar-width: none; }
.srow a { position: relative; display: flex; align-items: center; padding: 0 12px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; }
.srow a.on { font-weight: 600; color: var(--heading); }
.srow a.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 2px 2px 0 0; background: var(--brand-orange); }
@container hub (min-width: 640px) {
  .hdr { column-gap: 36px; padding: 12px 28px 0; }
  .logo span { display: inline; }
  .hnav a { padding: 0 18px; gap: 8px; }
  .hnav .long { display: inline; } .hnav .short { display: none; }
  .srow { padding: 0 16px; }
}

/* page */
.page { width: 100%; max-width: 1040px; margin: 0 auto; padding: 28px 16px 56px; display: flex; flex-direction: column; gap: 22px; flex: 1; }
@container hub (min-width: 640px) { .page { padding: 40px 24px 64px; gap: 26px; } }
.titlerow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.ptitle { display: flex; align-items: center; gap: 10px; }
.ptitle h1 { margin: 0; font-weight: 700; font-size: 28px; line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; color: var(--heading); }
@container hub (min-width: 640px) { .ptitle h1 { font-size: 34px; } }

/* segmented control (standings scope switcher pattern) */
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: color-mix(in oklab, var(--muted) 40%, transparent); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--heading); }
.seg button.on { background: var(--brand-orange); color: #fff; font-weight: 600; }
.cats { display: flex; width: 100%; }
.cats button { flex: 1 1 0; padding: 8px 6px; font-size: 13px; }
@container hub (min-width: 640px) { .cats { width: auto; } .cats button { flex: 0 0 auto; padding: 7px 18px; font-size: 13.5px; } }

/* filters */
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
.filters .seg { grid-column: 1 / -1; justify-self: start; }
.fsel { position: relative; min-width: 0; }
.fsel select { appearance: none; width: 100%; height: 36px; border: 1px solid var(--input); background: var(--background); border-radius: 8px; padding: 0 30px 0 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; }
.fsel select:disabled { color: var(--muted-foreground); cursor: default; background: var(--muted); }
.fsel.set select { border-color: var(--brand-orange); font-weight: 600; color: var(--heading); }
.fsel::after { content: ""; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--muted-foreground); border-bottom: 1.5px solid var(--muted-foreground); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.reset { grid-column: 1 / -1; justify-self: start; border: 0; background: none; padding: 2px 0; font-size: 13px; font-weight: 600; color: var(--heading); cursor: pointer; }
.reset:hover { text-decoration: underline; text-underline-offset: 3px; }
@container hub (min-width: 640px) {
  .filters { display: flex; flex-wrap: wrap; gap: 10px; }
  .filters .seg { grid-column: auto; }
  .fsel { width: 190px; }
  .reset { margin-left: 4px; }
}

/* basis line */
.basis { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.basis b { color: var(--foreground); font-weight: 600; }
.basis .dot { opacity: .6; }
.seg.small button { padding: 4px 11px; font-size: 12.5px; }
.slotf { flex-basis: 100%; display: flex; width: max-content; margin-top: 4px; height: 32px; }
.seg.slotf { align-items: stretch; } .seg.slotf button { display: inline-flex; align-items: center; padding-block: 0; }
.slotf .fchip { height: 32px; padding-block: 0; }
.seg.slotf { display: inline-flex; }
.fchip { border: 1px solid var(--border); background: var(--background); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 500; color: var(--muted-foreground); cursor: pointer; line-height: 1.3; }
.fchip:hover { color: var(--foreground); }
.fchip.on { background: var(--brand-orange); border-color: var(--brand-orange); color: #fff; font-weight: 600; }
@container hub (min-width: 640px) { .slotf { flex-basis: auto; margin: 0 0 0 auto; } }

/* ranking */
.rank { border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.rt { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 540px; }
.rank.pin-name .rt { min-width: 500px; }
.rt th, .rt td { border-bottom: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: middle; white-space: nowrap; }
.rt tbody tr:last-child td { border-bottom: 0; }
.rt th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-foreground); background: var(--thead); padding-top: 9px; padding-bottom: 9px; }
.rt .r { text-align: right; }
.rt tbody tr { cursor: pointer; }
.rt tbody td { background: var(--background); }
.rt tbody tr:hover td { background: var(--row-hover); }
.rt .sticky { position: sticky; z-index: 2; }
.rt th.sticky { z-index: 3; }
.rt .s0 { left: 0; width: 34px; min-width: 34px; max-width: 34px; padding-left: 8px; padding-right: 2px; text-align: right; }
.rt .s1 { left: 34px; }
.rt .icc { width: 56px; min-width: 56px; padding-left: 8px; padding-right: 8px; }
.rt .edge { box-shadow: inset -1px 0 0 var(--border); }
.rt .rkc { font-size: 13px; color: var(--muted-foreground); }
.rt .nmc { min-width: 150px; }
.rt td.nmc.sticky { max-width: 170px; white-space: normal; }
.rt .t { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; font-weight: 600; font-size: 14px; color: var(--heading); line-height: 1.25; }
.rt .usec { width: 1%; min-width: 150px; }
.rt .wrc { width: 1%; font-size: 14px; font-weight: 500; padding-left: 16px; }
.rt .mtc { width: 1%; font-size: 13px; padding-right: 14px; }
.ic { width: 40px; height: 30px; display: grid; place-items: center; }
.ic img { width: 40px; height: 30px; image-rendering: pixelated; }
.ic img.item { width: 26px; height: 26px; image-rendering: auto; }
.ic .ph { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--border); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted-foreground); }
.ic .none { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted-foreground); position: relative; opacity: .7; }
.ic .none::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1.5px; background: var(--muted-foreground); transform: translateX(-50%) rotate(45deg); }
.mega { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 999px; border: 1px solid color-mix(in oklab, var(--brand-orange) 55%, transparent); color: var(--brand-orange); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.bar { height: 5px; border-radius: 3px; background: var(--muted); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--chart-1); }
.use { font-weight: 600; font-size: 14px; text-align: right; }
.ucell { display: grid; grid-template-columns: minmax(70px, 1fr) 54px; align-items: center; gap: 10px; }
@container hub (min-width: 640px) {
  .rt th, .rt td { padding-left: 12px; padding-right: 12px; }
  .rt .s0 { width: 44px; min-width: 44px; max-width: 44px; padding-left: 12px; }
  .rt .s1 { left: 44px; }
  .rt .usec { min-width: 280px; }
  .ucell { grid-template-columns: minmax(160px, 1fr) 58px; gap: 14px; }
  .rt .edge { box-shadow: none; }
  .rt td.nmc.sticky { max-width: none; }
}

/* short label, the longer explanation on hover, focus or tap */
.tip { position: relative; display: inline-block; cursor: help; text-decoration: underline dotted; text-decoration-color: color-mix(in oklab, var(--muted-foreground) 60%, transparent); text-underline-offset: 3px; outline-offset: 2px; }
.tipbox { position: absolute; top: calc(100% + 8px); z-index: 30; width: max-content; max-width: 220px; padding: 8px 10px; border-radius: 8px; background: var(--brand-blue); color: #fff; font-size: 12.5px; font-weight: 500; line-height: 1.45; letter-spacing: 0; text-transform: none; text-align: left; white-space: normal; box-shadow: 0 6px 18px oklch(0.2 0.06 264 / 0.25); opacity: 0; visibility: hidden; transition: opacity .12s; pointer-events: none; }
.hub.dark .tipbox { background: oklch(0.3 0.05 265); }
.tip.right .tipbox { right: -6px; } .tip.left .tipbox { left: -6px; }
.tip:hover .tipbox, .tip:focus .tipbox, .sort:focus-visible .tipbox { opacity: 1; visibility: visible; }
.sort { all: unset; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.sort .arr { display: inline-block; width: 9px; font-size: 12px; color: var(--brand-orange); }
.sort:hover, .sort.on { color: var(--heading); }
.sort:focus-visible { outline: 2px solid var(--brand-orange); outline-offset: 2px; border-radius: 3px; }

/* dex card: a move's or ability's game data in the sprite's place */
.ic img.type { width: 24px; height: 24px; }
.drow img.type { width: 18px; height: 18px; }
.dex img.type { width: 22px; height: 22px; }
.drow .n img.type { margin-right: 2px; }
.dex { --type: var(--muted-foreground); border: 1px solid color-mix(in oklab, var(--type) 55%, transparent); background: color-mix(in oklab, var(--type) 13%, var(--card)); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dex-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.dex-f { font-size: 13.5px; font-weight: 600; color: var(--heading); }
.dex-d { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--foreground); }
.dhead .dex { margin-top: 12px; max-width: 280px; }

/* empty card */
.empty { border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; max-width: 640px; }
.empty .h { display: flex; align-items: center; gap: 10px; }
.empty h2 { margin: 0; font-weight: 700; font-size: 22px; line-height: 1.2; text-transform: uppercase; letter-spacing: .02em; color: var(--heading); }
.empty p { margin: 12px 0 0; font-size: 15px; line-height: 1.65; color: var(--muted-foreground); }
.btn-outline { margin-top: 20px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--background); font-size: 14px; font-weight: 500; cursor: pointer; }
.btn-outline:hover { background: var(--muted); }
@container hub (min-width: 640px) { .empty { padding: 28px 32px; } .empty h2 { font-size: 24px; } }

/* detail */
.back { font-size: 14px; font-weight: 600; color: var(--heading); cursor: pointer; background: none; border: 0; padding: 0; align-self: flex-start; }
.back:hover { text-decoration: underline; text-underline-offset: 3px; }
.dhead { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 14px; align-items: center; }
.dhead .art { width: 76px; height: 76px; display: grid; place-items: center; }
.dhead .art img { max-width: 76px; max-height: 76px; }
.dhead .art img.px { width: 64px; height: 48px; image-rendering: pixelated; }
.dhead .art img.item { width: 44px; height: 44px; }
.kick { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted-foreground); }
.dname { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 6px; }
.dname h1 { margin: 0; font-weight: 700; font-size: 28px; line-height: 1.1; color: var(--heading); letter-spacing: .01em; }
.dname h1.up { text-transform: uppercase; letter-spacing: .02em; }
.dname .mega { height: 22px; font-size: 11px; padding: 0 8px; }
.also { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--muted-foreground); }
.also a { font-weight: 600; color: var(--heading); cursor: pointer; }
.also .fm { font-weight: 600; color: var(--foreground); }
.also a:hover { text-decoration: underline; text-underline-offset: 3px; }
@container hub (min-width: 640px) {
  .dhead { grid-template-columns: 112px minmax(0,1fr); gap: 22px; }
  .dhead .art { width: 112px; height: 112px; }
  .dhead .art img { max-width: 112px; max-height: 112px; }
  .dhead .art img.px { width: 80px; height: 60px; }
  .dname h1 { font-size: 34px; }
}
.facts { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 12px; }
.fact { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; position: relative; }
.fact .lbl { align-self: flex-start; }
.fact + .fact { border-left: 1px solid var(--border); }
.fact .lbl { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted-foreground); }
.fact .big { font-size: 26px; font-weight: 700; color: var(--heading); line-height: 1.15; }
.fact .ctx { font-size: 12.5px; color: var(--muted-foreground); line-height: 1.4; }
.side { font-size: 13px; color: var(--muted-foreground); margin-top: -10px; }
.side b { color: var(--foreground); font-weight: 600; }
@container hub (min-width: 640px) { .facts { max-width: 560px; } .fact { padding: 16px 20px; } .fact .big { font-size: 30px; } }

.sh { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.sh .l { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sh h2 { margin: 0; font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; color: var(--heading); }
.sh .meta { font-size: 12.5px; color: var(--muted-foreground); white-space: nowrap; }
@container hub (min-width: 640px) { .sh h2 { font-size: 22px; } }
.dgrid { display: grid; grid-template-columns: minmax(0,1fr); gap: 28px; }
@container hub (min-width: 760px) { .dgrid { grid-template-columns: minmax(0,1fr) minmax(0,1fr); column-gap: 40px; } .dgrid .wide { grid-column: 1 / -1; } }
.panel { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dlist { display: flex; flex-direction: column; margin-top: 6px; }
.drow { display: grid; grid-template-columns: minmax(0,1fr) 54px; column-gap: 12px; row-gap: 5px; align-items: center; padding: 8px 6px; border-radius: 8px; }
.drow.ic2 { grid-template-columns: 40px minmax(0,1fr) 54px; }
.drow.ic2 .bar { grid-column: 2 / -1; }
.drow .bar { grid-column: 1 / -1; }
a.drow { cursor: pointer; }
a.drow:hover { background: var(--muted); }
.drow .n { font-size: 14px; font-weight: 500; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; }
.drow .p { text-align: right; font-weight: 600; font-size: 14px; }
.fixed { display: flex; align-items: center; gap: 10px; padding: 10px 6px 4px; font-size: 14px; }
.fixed .lbl { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted-foreground); }
.fixed .val { font-weight: 600; color: var(--brand-orange); }
.fixed img { width: 26px; height: 26px; }
.subl { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted-foreground); padding: 10px 6px 0; }
.mates { display: grid; grid-template-columns: minmax(0,1fr); }
@container hub (min-width: 760px) { .mates { grid-template-columns: repeat(2, minmax(0,1fr)); column-gap: 28px; } }
.more { align-self: flex-start; margin: 4px 6px 0; border: 0; background: none; padding: 0; font-size: 13.5px; font-weight: 600; color: var(--heading); cursor: pointer; }
.more:hover { text-decoration: underline; text-underline-offset: 3px; }
.foot { border-top: 1px solid var(--border); padding: 18px 16px; font-size: 12.5px; color: var(--muted-foreground); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease; } }

// Entry: {key, name, icon, kind:'pkmn'|'item'|'none'|'text', mega, count, wins, rated}
function mk(key, name, icon, kind, mega, count, wr) {
  const rated = Math.max(0, Math.round(count * (0.9 + hash(key) * 0.06)));
  return { key, name, icon, kind, mega, count, rated, wins: Math.round(rated * wr / 100) };
}

// A narrow filter: 14 teams. Counts shrink, some entries drop out, win rates
// get the 0 % / 100 % of tiny samples.
function shrink(list, factor, salt) {
  const out = [];
  for (const e of list) {
    const c = Math.round(e.count * factor * (0.4 + hash(e.key + salt) * 1.3));
    if (c <= 0) continue;
    const rated = c;
    const wins = Math.round(rated * (hash(e.key + salt + "w") * 0.8 + 0.1));
    out.push({ ...e, count: c, rated, wins: rated === 1 ? (hash(e.key + "o") > 0.5 ? 1 : 0) : wins, match: e.match ? (e.match === e.count ? c : Math.max(0, c - 1)) : 0 });
  }
  return out;
}
function fitTo(list, total) { // keep the six-per-team arithmetic exact in the narrow set
  let diff = total - list.reduce((s, e) => s + e.count, 0);
  let i = 0;
  while (diff !== 0 && list.length) { const e = list[i % Math.min(list.length, 6)]; if (diff > 0) { e.count++; e.rated++; diff--; } else if (e.count > 1) { e.count--; e.rated--; diff++; } i++; }
  return list;
}

    const base = S.cat === "pokemon" ? ds.teams : ds.slots;
    const counted = S.cat === "items" && S.noStones
      ? ds.items.map((e) => { if (!e.match) return e; const c = e.count - e.match; const rated = Math.round(e.rated * c / e.count); return { ...e, count: c, rated, wins: Math.round(e.wins * c / e.count) }; }).filter((e) => e.count > 0)
      : null;
    const pool = counted ? sorted(counted) : byUse;

    const kept = pool.filter((e) => (!S.minUse || e.count / base * 100 >= Number(S.minUse)) &&

  document.getElementById("views").innerHTML = Object.entries(VIEWS).map(([k, l]) => `<button class="chip" data-view="${k}" aria-pressed="${S.view === k}">${l}</button>`).join("");
  document.getElementById("states").innerHTML = Object.entries(STATES[S.view]).map(([k, l]) => `<button class="chip" data-state="${k}" aria-pressed="${S.state === k}">${l}</button>`).join("");
  (document.getElementById("place") || {}).innerHTML = [["panel", "Panel"], ["head", "Kopfzeile"]].map(([k, l]) => `<button class="chip" data-place="${k}" aria-pressed="${S.place === k}">${l}</button>`).join("");
  (document.getElementById("lbl") || {}).innerHTML = [["full", "Voller Name"], ["short", "Nur Form"]].map(([k, l]) => `<button class="chip" data-lbl="${k}" aria-pressed="${S.lbl === k}">${l}</button>`).join("");
  document.getElementById("themes").innerHTML = [["system", "System"], ["light", "Hell"], ["dark", "Dunkel"]].map(([k, l]) => `<button class="chip" data-theme="${k}" aria-pressed="${S.theme === k}">${l}</button>`).join("");
}
function isDark() { return S.theme === "dark" || (S.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches); }
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-place],[data-lbl],[data-view],[data-state],[data-theme],[data-cat],[data-phase],[data-open],[data-act],[data-sort],[data-mega]");
  if (!t) return;
  ev.preventDefault();
  const d = t.dataset;
  if (d.place) { S.place = d.place; render(); }
  else if (d.lbl) { S.lbl = d.lbl; render(); }
  else if (d.view) applyState(d.view, Object.keys(STATES[d.view])[0]);
  else if (d.state) applyState(S.view, d.state);
  else if (d.theme) { S.theme = d.theme; try { document.documentElement.dataset.theme = d.theme === "system" ? "" : d.theme; if (d.theme === "system") delete document.documentElement.dataset.theme; } catch (e) {} render(); }
  else if (d.mega !== undefined) { S.mega = d.mega; S.state = "custom"; render(); }
  else if (d.sort) { S.sort = S.sort.key === d.sort ? { key: d.sort, dir: S.sort.dir === "desc" ? "asc" : "desc" } : { key: d.sort, dir: d.sort === "name" ? "asc" : "desc" }; render(); }
  else if (d.cat) { S.cat = d.cat; S.showAll = false; render(); }
  else if (d.phase) { S.phase = d.phase; S.day = ""; S.state = "custom"; render(); }
  else if (d.open) { const cat = categoryOf(d.open); lastRanking = { cat: S.view === "ranking" ? S.cat : lastRanking.cat }; S.view = cat === "pokemon" ? "pokemon" : "entry"; S.entry = d.open; S.state = "custom"; render(); scrollTo({ top: 0 }); }
  else if (d.act === "back") { S.view = "ranking"; S.cat = lastRanking.cat; S.state = "custom"; render(); }
  else if (d.act === "reset") { Object.assign(S, { phase: "all", div: "", day: "", minUse: "", mega: "", noProtect: false, noStones: true, state: S.view === "ranking" ? "normal" : S.state === "absent" ? "custom" : S.state }); render(); }
  else if (d.act === "stones") { S.noStones = !S.noStones; S.state = "custom"; render(); }
  else if (d.act === "protect") { S.noProtect = !S.noProtect; S.state = "custom"; render(); }
  else if (d.act === "all") { S.showAll = true; render(); }
});
document.addEventListener("change", (ev) => {
  const f = ev.target.dataset && ev.target.dataset.f;
  if (!f) return;
  S[f] = ev.target.value; S.state = "custom"; render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
applyState(DEFAULT_VIEW, Object.keys(STATES[DEFAULT_VIEW])[0]);
</script>

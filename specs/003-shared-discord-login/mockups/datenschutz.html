.signin { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--background); color: var(--foreground); }
main { width: 100%; max-width: 760px; margin: 0 auto; padding: 48px 24px; flex: 1; }
main h1 { margin: 0 0 32px; font-size: 32px; line-height: 1.05; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--heading); hyphens: auto; }
article { display: flex; flex-direction: column; gap: 12px; font-size: 14.5px; line-height: 1.65; color: var(--muted-foreground); }
article h2 { margin: 24px 0 0; font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--heading); }
article p, article ul { margin: 0; }
article ul { display: flex; flex-direction: column; gap: 6px; padding-left: 20px; }

footer.site .sep { color: var(--border); }
@container (min-width: 640px) {
  .bar { padding: 12px 28px; }

  main { padding: 48px 32px; }
  main h1 { font-size: 40px; }
}
@media (prefers-reduced-motion: no-preference) { .highlight mark { transition: background-color .2s; } }
</style>

<div class="shell">

    </div>
    <div class="group"><span>Stand</span>
      <div class="seg" id="version" role="group" aria-label="Stand">

        <button type="button" data-version="after" aria-pressed="true">Neu</button>
      </div>
    </div>
    <div class="group"><span>Farbschema</span>
      <div class="seg" id="theme" role="group" aria-label="Farbschema">

<template id="page">
  <div class="hub highlight">
    <div class="accent"></div>
    <div class="bar">
      <div class="brand"><span class="logo" aria-hidden="true">BH</span><b>Buli Hub</b></div>
      <span class="signin">Mit Discord anmelden</span>
    </div>
    <main>
      <h1>Datenschutzerklärung</h1>
      <article>
        <p data-before>Stand: Juli 2026</p>
        <p data-after><mark>Stand: Oktober 2026</mark></p>
        <p class="gap" aria-hidden="true">· · ·</p>
        <h2>6. Cookies</h2>
        <p>
          Wir setzen ausschließlich technisch notwendige Cookies ein, die für die
          Anmeldung und das Aufrechterhalten deiner Sitzung erforderlich sind. Es
          findet kein Tracking und keine Reichweiten- oder Werbeanalyse statt.
        </p>
        <p data-after><mark>Die Anmeldung gilt für alle Seiten der VGC Gemeinde unter vgcgemein.de,
          etwa den Buli Hub und das Tippspiel. Das Anmelde-Cookie wird deshalb an diese
          Seiten übermittelt, damit du dich nur einmal anmelden musst. Wenn du dich abmeldest,
          endet die Sitzung auf all diesen Seiten in diesem Browser.</mark></p>
        <h2>7. Empfänger und Auftragsverarbeiter</h2>
        <p>
          Zur Bereitstellung der Plattform setzen wir Dienstleister ein, die Daten
          in unserem Auftrag verarbeiten:

        <ul>
          <li>Supabase (Datenbank, Authentifizierung, Speicher),</li>

        </ul>
        <p class="gap" aria-hidden="true">· · ·</p>
      </article>
    </main>
    <footer class="site"><div><span>© 2026 VGC Gemeinde</span><span class="sep">·</span><span>Impressum</span><span>Datenschutz</span><span>Regelwerk</span></div></footer>
  </div>
</template>

<script>
(function () {
  var tpl = document.getElementById("page");
  var slots = document.querySelectorAll("[data-slot]");
  slots.forEach(function (slot) { slot.appendChild(tpl.content.cloneNode(true)); });
  var state = { version: "after", theme: "light", highlight: true };
  function render() {
    document.querySelectorAll(".hub").forEach(function (hub) {
      hub.classList.toggle("dark", state.theme === "dark");
      hub.classList.toggle("highlight", state.highlight);
      hub.querySelectorAll("[data-before]").forEach(function (el) { el.hidden = state.version !== "before"; });
      hub.querySelectorAll("[data-after]").forEach(function (el) { el.hidden = state.version !== "after"; });
    });
    document.querySelectorAll("#version button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.version === state.version)); });
    document.querySelectorAll("#theme button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.themeChoice === state.theme)); });
  }
  document.getElementById("version").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { state.version = b.dataset.version; render(); } });
  document.getElementById("theme").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { state.theme = b.dataset.themeChoice; render(); } });
  document.getElementById("highlight").addEventListener("change", function (e) { state.highlight = e.target.checked; render(); });
  render();
})();
</script>

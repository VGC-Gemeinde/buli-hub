<title>Buli Hub Wartung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a mockup toolbar over two live frames (desktop up to 1120px, phone 390px) rendering the
   same maintenance page; the hub's tokens live on .hub (light, or .hub.dark), the shell's on :root. */
:root {
  --shell-bg: oklch(0.975 0.006 262);
  --shell-fg: oklch(0.28 0.06 264);
  --shell-muted: oklch(0.52 0.035 263);
  --shell-border: oklch(0.9 0.012 262);
  --shell-card: #ffffff;
  --shell-accent: #ff7b00;
  --font: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shell-bg: oklch(0.13 0.035 265); --shell-fg: oklch(0.96 0.005 260);
    --shell-muted: oklch(0.72 0.025 262); --shell-border: oklch(1 0 0 / 12%);
    --shell-card: oklch(0.17 0.045 265); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --shell-bg: oklch(0.13 0.035 265); --shell-fg: oklch(0.96 0.005 260);
  --shell-muted: oklch(0.72 0.025 262); --shell-border: oklch(1 0 0 / 12%);
  --shell-card: oklch(0.17 0.045 265); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--shell-bg); color: var(--shell-fg); font-family: var(--font); margin: 0; }
.shell { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-start; margin-bottom: 22px; }
.toolbar h1 { font-size: 15px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.toolbar p { margin: 0; font-size: 12.5px; color: var(--shell-muted); max-width: 56ch; line-height: 1.5; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group > span { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--shell-muted); }
.seg { display: inline-flex; border: 1px solid var(--shell-border); border-radius: 8px; overflow: hidden; background: var(--shell-card); }
.seg button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 7px 12px; border: 0; background: transparent; color: var(--shell-fg); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--shell-border); }
.seg button[aria-pressed="true"] { background: var(--shell-accent); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--shell-accent); outline-offset: -2px; }
.frames { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.frame { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.frame > span { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--shell-muted); }
.frame.desk { width: min(1120px, 100%); }
.frame.phone { width: min(390px, 100%); }
.screen { border: 1px solid var(--shell-border); border-radius: 12px; overflow: hidden; container-type: inline-size; }
.phone .screen { border-radius: 22px; }

/* The hub, tokens from src/app/globals.css */
.hub {
  --brand-blue: #021f66; --brand-orange: #ff7b00;
  --background: #ffffff; --foreground: oklch(0.28 0.06 264);
  --muted: oklch(0.965 0.008 262);
  --muted-foreground: oklch(0.52 0.035 263); --border: oklch(0.91 0.012 262);
  --heading: #021f66; --link: #021f66; --mark-opacity: .05;
  position: relative; overflow: hidden;
  background: var(--background); color: var(--foreground); font-family: var(--font);
  display: flex; flex-direction: column; min-height: 640px;
}
.hub.dark {
  --background: oklch(0.17 0.045 265); --foreground: oklch(0.96 0.005 260);
  --muted: oklch(1 0 0 / 8%);
  --muted-foreground: oklch(0.72 0.025 262); --border: oklch(1 0 0 / 12%);
  --heading: #ffffff; --link: #ffffff; --mark-opacity: .06;
}
.accent { height: 3px; background: var(--brand-orange); flex-shrink: 0; }
.bar { position: relative; z-index: 1; display: flex; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 12px; height: 48px; }
.brand img { height: 28px; width: auto; border-radius: 6px; }
.brand b { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 56px 24px; }
.badge { width: 104px; height: auto; border-radius: 16px; box-shadow: 0 8px 28px oklch(0.2 0.06 264 / 0.25); margin-bottom: 32px; }
.kicker { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 12.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); }
.tick { display: inline-block; width: 14px; height: 7px; background: var(--brand-orange); transform: skewX(-18deg); }
main h1 { margin: 0 0 18px; font-size: 32px; line-height: 1.05; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--heading); text-wrap: balance; }
.lead { margin: 0; max-width: 44ch; font-size: 15px; line-height: 1.65; color: var(--muted-foreground); text-wrap: pretty; }
.when { margin-top: 26px; display: inline-flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 20px; border-radius: 10px; background: var(--muted); }
.when small { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); }
.when strong { font-size: 17px; font-weight: 600; color: var(--heading); font-variant-numeric: tabular-nums; }
.action { margin-top: 26px; font-size: 14px; font-weight: 600; color: var(--link); text-decoration: none; }
.action:hover { text-decoration: underline; text-underline-offset: 3px; }
.watermark { position: absolute; z-index: 0; right: -90px; bottom: -110px; width: 460px; transform: rotate(-10deg); border-radius: 40px; opacity: var(--mark-opacity); pointer-events: none; }
footer.site { position: relative; z-index: 1; border-top: 1px solid var(--border); padding: 12px 24px; font-size: 12.5px; color: var(--muted-foreground); }
footer.site div { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; max-width: 1040px; margin: 0 auto; }
footer.site .sep { color: var(--border); }
footer.site .legal { color: inherit; text-decoration: none; }
footer.site .legal:hover { color: var(--foreground); }
@container (min-width: 640px) {
  .bar { padding: 12px 28px; }
  main h1 { font-size: 40px; }
  .badge { width: 132px; margin-bottom: 36px; }
  .watermark { width: 560px; right: -96px; bottom: -112px; }
}
</style>

<div class="shell">
  <div class="toolbar">
    <div>
      <h1>Wartung</h1>
      <p>Spec 004, FR-018: Solange die Wartung eingeschaltet ist, zeigt jede Route diese Seite (HTTP 503). Generisch, nennt keinen Anlass. Keine Anmeldung, keine Navigation, keine Umgehung, keine Uhrzeit. Impressum und Datenschutz bleiben erreichbar.</p>
    </div>
    <div class="group"><span>Farbschema</span>
      <div class="seg" id="theme" role="group" aria-label="Farbschema">
        <button type="button" data-theme-choice="light" aria-pressed="true">Hell</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Dunkel</button>
      </div>
    </div>
  </div>

  <div class="frames">
    <div class="frame desk"><span>Desktop</span><div class="screen" data-slot></div></div>
    <div class="frame phone"><span>Phone · 390px</span><div class="screen" data-slot></div></div>
  </div>
</div>

<script>
(function () {
  var tpl = document.getElementById("page");
  document.querySelectorAll("[data-slot]").forEach(function (slot) { slot.appendChild(tpl.content.cloneNode(true)); });
  var state = { theme: "light" };
  function render() {
    document.querySelectorAll(".hub").forEach(function (hub) {
      hub.classList.toggle("dark", state.theme === "dark");
    });
    document.querySelectorAll("#theme button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.themeChoice === state.theme)); });
  }
  document.getElementById("theme").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { state.theme = b.dataset.themeChoice; render(); } });
  render();
})();
</script>
